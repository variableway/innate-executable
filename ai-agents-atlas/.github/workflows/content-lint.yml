name: Content lint

on:
  pull_request:
    paths:
      - 'src/content/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate frontmatter against schemas
        run: |
          pnpm build
          echo "Frontmatter validation passed"
      - name: Detect broken markdown links
        run: |
          find src/content -name '*.mdx' -o -name '*.md' | \
            xargs -I{} grep -Eoh '\]\([^h)]+\)' {} | sort -u | \
            head -50 || true