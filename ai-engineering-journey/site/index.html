<!DOCTYPE html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Engineering Journey</title>
    <meta name="description" content="AI Engineering from Scratch — TanStack rewrite with dual lesson modes, zh/en, shadcn-ui themes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var stored = localStorage.getItem('aej-theme');
        var theme = stored === 'light' || stored === 'dark' || stored === 'shadcn' ? stored : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
